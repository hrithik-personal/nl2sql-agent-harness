# LiteLLM proxy config.
# Per-agent model routing: the Planner/Verifier get a stronger model, the
# Writer/Explainer a cheaper/faster one. Swap model ids for whatever you have
# access to.
# The proxy runs DB-backed (DATABASE_URL in docker-compose.yml), which unlocks
# the admin UI plus a budgeted, model-scoped virtual key per agent. Mint them
# with `make litellm-keys`; each key is restricted to its own model alias (+ its
# fallback target) and carries a 30-day budget, so spend is tracked per agent and
# a key can't call another agent's model.

model_list:
  - model_name: planner-model
    litellm_params:
      model: anthropic/claude-sonnet-4-5
  - model_name: verifier-model
    litellm_params:
      model: anthropic/claude-sonnet-4-5
  - model_name: writer-model
    litellm_params:
      model: anthropic/claude-haiku-4-5
  - model_name: explainer-model
    litellm_params:
      model: anthropic/claude-haiku-4-5

litellm_settings:
  drop_params: true
  # Provider fallback (Claude -> OpenAI) for cascading-failure handling.
  fallbacks:
    - planner-model: ["gpt-4o"]
    - verifier-model: ["gpt-4o"]
    - writer-model: ["gpt-4o-mini"]
    - explainer-model: ["gpt-4o-mini"]

general_settings:
  master_key: sk-local-master
