[project]
name = "nl2sql-agent-harness"
version = "0.1.0"
description = "Multi-agent Text-to-SQL analytics agent (LangGraph) with evals-in-CI, model routing, observability, and a sandboxed SQL executor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hrithik Kumar" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlglot>=25.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "langgraph>=0.2.40",
    "langgraph-checkpoint-postgres>=2.0",
    "litellm>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "altair>=5.3",
    "pandas>=2.2",
    "faker>=28.0",
    "httpx>=0.27",
    "mcp>=1.2",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openinference-instrumentation-litellm>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nl2sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
